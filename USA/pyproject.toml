[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usa_city_features"
version = "1.0.0"
description = "USA City Features Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
usa_city_features = "usa_city_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
